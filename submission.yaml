disclaimers:
  - "All data is synthetic and does not represent real patients or products"
  - "PRR is a disproportionality screening statistic — does not prove causality"
  - "CTD checklist is a configurable prototype — not a legal regulatory certification"
  - "This system does not make clinical, causal, or regulatory decisions"
