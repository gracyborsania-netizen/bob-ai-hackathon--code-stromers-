submission:
  title: "PharmaGuard AI"
  problem_statement: "P2 – Drug Safety Signal Detector & Regulatory Submission Readiness Checker"
  solution_summary: >
    PharmaGuard AI is an AI-assisted screening prototype that addresses drug safety
    signal detection using the Proportional Reporting Ratio (PRR) method and
    regulatory submission readiness checking using a CTD-inspired checklist covering
    ICH CTD Modules 1–5. The system includes an IBM Bob integration adapter for
    optional AI-assisted plain-language explanations and gap summaries.
    All data is synthetic. The tool does not make clinical or regulatory decisions.
  key_features:
    - "PRR-based safety signal detection with configurable threshold"
    - "Automatic signal ranking (highest PRR first) and flagging"
    - "Full 2x2 contingency table display (a, b, c, d values)"
    - "CTD-inspired submission readiness checking across Modules 1-5"
    - "Module-wise completeness scores with visual bar chart"
    - "Missing requirement detection via keyword matching"
    - "Downloadable gap report (TXT and CSV)"
    - "Optional IBM Bob AI-assisted signal explanations"
    - "Optional IBM Bob AI-assisted gap summaries"
    - "Synthetic demo data — works fully without IBM Bob credentials"
  tech_stack:
    - "Python"
    - "Streamlit"
    - "Pandas"
    - "NumPy"
    - "python-dotenv"
    - "IBM Bob integration adapter"
    - "GitHub Actions"

