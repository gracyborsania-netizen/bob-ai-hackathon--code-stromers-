submission:
  title: "Pharmaguard AI"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
     Detect potential drug safety signals from large amounts of pharmaceutical safety data, reducing the time and effort required for manual analysis.
     Ensure regulatory submissions are complete and meet required standards before submission, reducing errors and improving submission readiness.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
     An AI-powered system that analyzes drug safety data to detect potential safety signals and highlights possible risks.
     It also checks regulatory submission documents for completeness, identifies missing or incorrect information, and provides a readiness score before submission.


  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "AI Safety Signal Detection – Detects potential drug safety risks from available data."                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - "Risk Alerts – Highlights important safety concerns for review."
    - "Submission Readiness Check – Checks whether required regulatory information is complete."
    - "Missing Information Detection – Identifies incomplete or missing details."                               # optional 4th
    - "Readiness Score – Provides a score indicating how ready the submission is."                               # optional 5th

  tech_stack:
    languages: ["Python", "JavaScript", "HTML", "CSS"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["Streamlit"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["wtsonx.ai", "IBM Bob, "IBM Granite"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["SQL Lite"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["Github Actions", "NLP", "Machine Learning", "REST API"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    We are most proud of combining AI-powered drug safety signal detection with regulatory submission readiness checking in one solution.
    It helps identify potential safety concerns early while reducing manual effort and improving the completeness of regulatory submissions.

  known_limitations: >                 # Optional but recommended — be honest about gaps
   1. The accuracy of results depends on the quality and completeness of the available data.
   2. AI-generated results require review by qualified medical or regulatory professionals before making final decisions.
   3. The system may not cover every drug safety scenario or regulatory requirement.

